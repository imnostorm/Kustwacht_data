<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maritiem Dashboard NL</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; background-color: #0b1e33; color: #fff; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 15px; }
        
        .panel { background: #1a2e44; border: 1px solid #007dc5; border-radius: 8px; padding: 15px; overflow: hidden; }
        .panel h2 { color: #00d4ff; margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #334a66; padding-bottom: 10px; }
        
        /* Kaarten en Berichten */
        iframe { width: 100%; height: 450px; border: none; background: white; border-radius: 4px; }
        .weather-reports { height: 300px; overflow-y: auto; background: #000; color: #0f0; padding: 10px; font-family: monospace; font-size: 0.85rem; }
        
        /* Data Tabel */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #007dc5; text-align: left; padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid #334a66; }
        .location-select { width: 100%; padding: 8px; margin-bottom: 10px; background: #0b1e33; color: white; border: 1px solid #00d4ff; }
        
        .value { color: #00d4ff; font-weight: bold; }
    </style>
</head>
<body>

<h1 style="text-align:center; color: #00d4ff;">Maritiem Operationeel Dashboard</h1>

<div class="dashboard">

    <div class="panel">
        <h2>KNMI Waarschuwingen Kust & Binnenwater</h2>
        <iframe src="https://www.knmi.nl/nederland-nu/weer/waarschuwingen/overzicht"></iframe>
    </div>

    <div class="panel">
        <h2>KNMI Waarschuwingen Noordzee</h2>
        <iframe src="https://www.knmi.nl/nederland-nu/weer/waarschuwingen-noordzee"></iframe>
    </div>

    <div class="panel">
        <h2>Officiële Berichten</h2>
        <select class="location-select" onchange="document.getElementById('report-frame').src = this.value">
            <option value="https://www.knmi.nl/nederland-nu/scheepvaart/marifoonbericht">Marifoonbericht</option>
            <option value="https://www.knmi.nl/nederland-nu/scheepvaart/scheepvaartbericht">Scheepvaartbericht</option>
        </select>
        <iframe id="report-frame" src="https://www.knmi.nl/nederland-nu/scheepvaart/marifoonbericht" style="height: 350px;"></iframe>
    </div>

    <div class="panel">
        <h2>Live Meetgegevens (RWS)</h2>
        <select id="locatie-kiezer" class="location-select" onchange="updateDashboardData()">
            <option value="HARLNG">Harlingen</option>
            <option value="DENHLDR">Den Helder</option>
            <option value="WESTTS">West-Terschelling</option>
            <option value="VLIES">Vlieland</option>
            <option value="LAUWOG">Lauwersoog</option>
        </select>
        
        <table>
            <tr><td>Waterhoogte (Huidig)</td><td class="value" id="val-water-nu">Laden...</td></tr>
            <tr><td>Astronomisch</td><td class="value" id="val-water-astro">--</td></tr>
            <tr><td>Afwijking (Opzet)</td><td class="value" id="val-water-afw">--</td></tr>
            <tr><td>Luchttemperatuur</td><td class="value" id="val-temp">--</td></tr>
            <tr><td>Wind</td><td class="value" id="val-wind">--</td></tr>
            <tr><td>Golfhoogte</td><td class="value" id="val-golf">--</td></tr>
        </table>
    </div>

</div>

<script>
    // Proxy om CORS te omzeilen
    const proxy = "https://api.allorigins.win/get?url=";

    async function updateDashboardData() {
        const loc = document.getElementById('locatie-kiezer').value;
        const status = document.getElementById('val-water-nu');
        status.innerHTML = "Laden...";

        // Voorbeeld link voor Waterhoogte via WFS
        const rwsUrl = `https://geo.rijkswaterstaat.nl/services/ogc/hws/DDAPI20/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=locatiesmetlaatstewaarneming&outputFormat=application/json&cql_filter=LOCATIE_NAAM%20LIKE%20'%25${loc}%25'`;
        
        try {
            const res = await fetch(proxy + encodeURIComponent(rwsUrl));
            const wrapper = await res.json();
            const data = JSON.parse(wrapper.contents);
            
            // We zoeken de juiste waarden in de lijst
            data.features.forEach(f => {
                const p = f.properties;
                if(p.PARAMETER_WAT_OMSCHRIJVING.includes("Waterhoogte")) {
                    document.getElementById('val-water-nu').innerHTML = p.NUMERIEKEWAARDE + " cm";
                }
                if(p.PARAMETER_WAT_OMSCHRIJVING.includes("Wind")) {
                    document.getElementById('val-wind').innerHTML = p.NUMERIEKEWAARDE + " m/s";
                }
            });
            
        } catch (e) {
            console.error(e);
            status.innerHTML = "Fout";
        }
    }

    // Initialiseer data
    updateDashboardData();
</script>

</body>
</html>
