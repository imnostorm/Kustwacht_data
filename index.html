<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kustwacht Data - Live Waterstanden</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #f4f7f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #003e7e; text-align: center; border-bottom: 2px solid #007dc5; padding-bottom: 10px; }
        #status { text-align: center; padding: 10px; margin-bottom: 20px; font-weight: bold; border-radius: 5px; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007dc5; color: white; cursor: pointer; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .waarde { font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h1>Live Waterstanden Waddenzee & Kust</h1>
    <div id="status" class="loading">Data wordt opgehaald uit Rijkswaterstaat Wadar...</div>
    
    <table id="data-tabel">
        <thead>
            <tr>
                <th>Locatie</th>
                <th>Meting</th>
                <th>Waarde (cm)</th>
                <th>Tijd</th>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
    </table>
</div>

<script>
    // Dit is de directe 'Waddendata' methode: We vragen specifiek om de laatste metingen
    async function getWaterData() {
        const statusDiv = document.getElementById('status');
        const body = document.getElementById('data-body');
        
        // De API URL van de nieuwe RWS omgeving (Wadar)
        const apiUrl = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen";
        
        // We vragen specifiek om Waterhoogte (WATHTE) in Oppervlaktewater (OW)
        const requestBody = {
            "AquoPlusWaarnemingMetadataLijst": [{
                "AquoMetadata": {
                    "Compartiment": { "Code": "OW" },
                    "Grootheid": { "Code": "WATHTE" }
                }
            }],
            "LocatieLijst": [
                {"Code": "harling"}, {"Code": "denhldr"}, {"Code": "terschlglw"}, 
                {"Code": "vlielndnh"}, {"Code": "nes"}, {"Code": "lauwoog"}, 
                {"Code": "delfzjl"}, {"Code": "huibertgt"}, {"Code": "eemshvn"}
            ]
        };

        try {
            // We gebruiken een simpele proxy om de browser-beveiliging te passeren
            const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(apiUrl);
            
            const response = await fetch(proxyUrl, {
                method: 'GET' // AllOrigins werkt het best met GET voor snelle data
            });

            const wrapper = await response.json();
            // In de nieuwe Wadar API moeten we de POST request simuleren via de URL of proxy
            // Omdat POST via proxy lastig is voor een leek, gebruiken we de WFS fallback die WEL werkt:
            
            const directUrl = "https://geo.rijkswaterstaat.nl/services/ogc/hws/DDAPI20/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=locatiesmetlaatstewaarneming&outputFormat=application/json&maxFeatures=50&cql_filter=COMPARTIMENT_OMSCHRIJVING='Waddenzee'";
            const finalProxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(directUrl);
            
            const finalRes = await fetch(finalProxy);
            const finalData = await finalRes.json();
            const features = JSON.parse(finalData.contents).features;

            let html = '';
            features.forEach(f => {
                const p = f.properties;
                const tijd = new Date(p.WAARNEMINGSTIJDSTIP).toLocaleTimeString('nl-NL', {hour: '2-digit', minute:'2-digit'});
                html += `<tr>
                    <td>${p.LOCATIE_NAAM}</td>
                    <td>Waterhoogte</td>
                    <td class="waarde">${p.NUMERIEKEWAARDE}</td>
                    <td>${tijd}</td>
                </tr>`;
            });

            body.innerHTML = html;
            statusDiv.className = "success";
            statusDiv.innerHTML = "Update succesvol: " + new Date().toLocaleTimeString('nl-NL');

        } catch (error) {
            statusDiv.className = "error";
            statusDiv.innerHTML = "Fout: " + error.message;
        }
    }

    getWaterData();
    setInterval(getWaterData, 300000); // Elke 5 minuten verversen
</script>

</body>
</html>
