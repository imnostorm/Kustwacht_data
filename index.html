<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Live Kustwacht Data</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #003e7e; }
        #status { padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .loading { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007dc5; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Live Waterstanden</h1>
    <div id="status" class="loading">Data aan het ophalen...</div>
    
    <table id="data-tabel">
        <thead>
            <tr>
                <th>Locatie</th>
                <th>Meting</th>
                <th>Waarde (NAP)</th>
                <th>Tijd</th>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
    </table>
</div>

<script>
    // We gebruiken de officiële WFS link maar dwingen JSON af
    const url = "https://geo.rijkswaterstaat.nl/services/ogc/hws/DDAPI20/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=locatiesmetlaatstewaarneming&outputFormat=application/json&cql_filter=PARAMETER_WAT_OMSCHRIJVING%20LIKE%20'%25Waterhoogte%25'";

    async function loadData() {
        const statusDiv = document.getElementById('status');
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('API geeft foutmelding: ' + response.status);
            
            const data = await response.json();
            const points = data.features;

            if (!points || points.length === 0) {
                statusDiv.innerHTML = "Geen data gevonden voor dit filter.";
                return;
            }

            // Sorteren op naam
            points.sort((a, b) => a.properties.LOCATIE_NAAM.localeCompare(b.properties.LOCATIE_NAAM));

            let rows = '';
            points.forEach(p => {
                const props = p.properties;
                const tijd = new Date(props.WAARNEMINGSTIJDSTIP).toLocaleTimeString('nl-NL');
                rows += `<tr>
                    <td>${props.LOCATIE_NAAM}</td>
                    <td>${props.PARAMETER_WAT_OMSCHRIJVING}</td>
                    <td><b>${props.NUMERIEKEWAARDE} cm</b></td>
                    <td>${tijd}</td>
                </tr>`;
            });

            document.getElementById('data-body').innerHTML = rows;
            statusDiv.className = "success";
            statusDiv.innerHTML = "Laatste update: " + new Date().toLocaleTimeString('nl-NL');

        } catch (err) {
            statusDiv.className = "error";
            statusDiv.innerHTML = "Fout: " + err.message + ". <br><small>Tip: Ververs de pagina of check of de RWS server online is.</small>";
            console.error(err);
        }
    }

    loadData();
</script>

</body>
</html>
